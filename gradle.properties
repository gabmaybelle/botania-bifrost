# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
build_number=457
group=vazkii.botania
java_version=25

# Xplat
minecraft_version=26.3
# PORT-26.3: the display name says this is the unofficial port; the mod id stays "botania".
mod_name=Botania Bifrost
# PORT-26.3: jar and Maven artifact names (botania-bifrost-<loader>-<mc version>-<build>).
archives_base_name=botania-bifrost
mod_author=Vazkii
mod_id=botania
license=Botania license
description=Botania is a tech mod themed around natural magic
website_url=https://botaniamod.net
# PORT-26.3: problems with this port go to its own tracker, not to the official Botania team.
sources_url=https://github.com/gabmaybelle/botania-bifrost
issue_url=https://github.com/gabmaybelle/botania-bifrost/issues
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
# PORT-26.3: no Parchment release exists for any 26.x version (checked 14 Oct 2026), so the builds use plain
# Mojang mappings for now. Put the version back and re-enable the parchment blocks in Xplat, Fabric and NeoForge
# build.gradle when one is published.
#parchment_version=

# Keep this synchronized with garden_of_glass/Makefile:
gog_version=14

# Uncomment to load the specified recipe viewer (instead of the default one)
#load_override_emi=true
#load_override_jei=true
#load_override_rei=true

#load_fabric_carpet=true
#load_fabric_speedrunigt=true

# Fabric
fabric_version=0.163.0+26.3
fabric_loader_version=0.19.5

# NeoForge
neoforge_version=26.3.0.77
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.warning.mode=all
