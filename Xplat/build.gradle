plugins {
    id("multiloader-common")
    alias(libs.plugins.mdg)
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file("src/main/resources/META-INF/accesstransformer_xplat.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    // PORT-26.3: no Parchment release for 26.x yet (see parchment_version in gradle.properties).
    //parchment {
    //    minecraftVersion = minecraft_version
    //    mappingsVersion = parchment_version
    //}
}

dependencies {
    compileOnly(libs.bundles.mixin)
    annotationProcessor(libs.mixin.extras)

    // PORT-26.3: Patchouli has no 26.3 build. Its 1.21.1 jar stays on the compile classpath for the API only:
    // the multiblock definitions and the Lexica item compile against it. The API classes are not on the
    // runtime classpath, so nothing may reach PatchouliAPI at startup (the config flags are guarded) and the
    // gameplay call sites (multiblocks, lexicon) stay broken until Phase 5 settles the Lexica.
    compileOnly(libs.patchouli.xplat)
    // PORT-26.3: disabled until these mods have 26.3 builds (their code is in src/disabled/integration).
    //compileOnly(libs.ears)
    compileOnly(libs.jei.common.api)
    //compileOnly(variantOf(libs.emi.xplat) { classifier("api") })
    // PORT-26.3: REI's API pulls Architectury, which names Fabric Loader; Xplat compiles without it and has no Fabric repo
    compileOnly(libs.rei.api) { exclude group: "net.fabricmc" }
    compileOnly(libs.rei.default.plugin) { exclude group: "net.fabricmc" }

    compileOnly(libs.jetbrains.annotations)
}

tasks.register("normalizeLanguageFiles", JavaExec) {
    group = "verification"
    description = "Normalize language file layout according to en_us.json"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "vazkii.botania.data.LangSortTool"
    workingDir = projectDir.parent
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava(sourceSets.main.java.sourceDirectories.files)
    commonResources(sourceSets.main.resources.sourceDirectories.files)
}
