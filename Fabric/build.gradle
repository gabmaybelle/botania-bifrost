plugins {
    id("multiloader-loader")
    alias(libs.plugins.fabric.loom)
}

loom {
    accessWidenerPath = file("src/main/resources/botania.accesswidener")

    runs {
        gameTest {
            server()
            vmArg("-Dfabric-api.gametest=1")
        }

        xplatDatagen {
            client()
            vmArg("-Dbotania.xplat_datagen=1")
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.modid=botania")
            vmArg("-Dfabric-api.datagen.output-dir=${file("../Xplat/src/generated/resources")}")
        }

        fabricDatagen {
            client()
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.modid=botania")
            vmArg("-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}")
        }

        configureEach {
            runDir("../run")
            ideConfigGenerated(true)
            vmArg("-Dfabric-tag-conventions-v2.missingTagTranslationWarning=VERBOSE")
        }
    }

}

test {
    useJUnitPlatform()
}

// PORT-26.3: client screenshot tests (src/gametest). `./gradlew :Fabric:runClientGameTest` starts a real
// game, walks through Botania's screens and renderers, and saves screenshots. Nothing here ships in the jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "botania_clienttest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    maven {
        name = "Modmuss"
        url = "https://maven.modmuss50.me/"
    }
    maven {
          name = "Ladysnake Libs"
          url = "https://maven.ladysnake.org/releases"
    }
    maven {
        name = "BuildCraft" // for LBA
        url = "https://mod-buildcraft.com/maven"
    }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.net/"
    }
    maven {
        name = "Masa"
        url = uri('https://masa.dy.fi/maven')
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    // PORT-26.3: Minecraft ships unobfuscated since 26.1, so there are no Mojang mappings to apply and Loom
    // wants no mappings block at all. Parchment (parameter names) has no 26.x release yet either; when it
    // does, it goes back as a layer here (see parchment_version in gradle.properties).
    //mappings loom.layered() {
    //    officialMojangMappings()
    //    parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    //}

    // PORT-26.3: the no-remap Loom plugin has no mod* configurations; mods are ordinary dependencies.
    implementation(libs.fabric.loader)
    implementation(libs.fabric.api)

    testImplementation(libs.fabric.junit)

    compileOnly(libs.jetbrains.annotations)

    // PORT-26.3: the Patchouli 26.3 port; 26.3 jars are not remapped, so plain implementation.
    compileOnly(libs.patchouli.xplat)
    implementation(libs.patchouli.fabric)
    // PORT-26.3: Trinkets ends at 1.21.1; Trinkets Updated (eu.pb4.trinkets) replaces it. Its jar bundles Yumi,
    // whose event classes the integration compiles against.
    implementation(libs.trinkets.updated)
    compileOnly(libs.yumi)
    implementation(libs.fiber)
    include(libs.fiber)

    // PORT-26.3: disabled until these mods have 26.3 builds (their code is in src/disabled/integration).
    //modCompileOnly(variantOf(libs.emi.fabric) { classifier("api") })
    compileOnly(libs.jei.fabric.api)
    compileOnly(libs.rei.fabric)
    compileOnly(libs.rei.api)
    compileOnly(libs.rei.default.plugin)

    //modCompileOnly(libs.ears)
    //modCompileOnly(libs.sodium.fabric) { transitive = false }
    //modCompileOnly(libs.teamreborn.energy)
    //modCompileOnly(libs.speedrunigt)

    // PORT-26.3: one recipe viewer at a time in dev runs (never JEI and REI together): JEI by default,
    // REI with -Pload_override_rei. EMI has no 26.3 build.
    if (rootProject.hasProperty("load_override_rei")) {
        localRuntime(libs.rei.fabric)
    } else {
        localRuntime(libs.jei.fabric.full)
    }

    // for testing multiplayer features in singleplayer worlds, and weird things like movable block entities
    //if (rootProject.hasProperty("load_fabric_carpet")) {
    //    modLocalRuntime(libs.carpet)
    //}

    //if (rootProject.hasProperty("load_fabric_speedrunigt")) {
    //    modLocalRuntime(libs.speedrunigt)
    //}

    if (file("../garden_of_glass/gardenofglass-${gog_version}.jar").exists()) {
        localRuntime(files("../garden_of_glass/gardenofglass-${gog_version}.jar"))
    }
}
