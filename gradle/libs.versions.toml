[versions]
# see https://fabricmc.net/develop/ for new versions
fabric-loom = "1.18.4"
fabric-loader = "0.19.5"
fabric-api = "0.163.0+26.3"

# see https://projects.neoforged.net/neoforged/moddevgradle for new versions
mdg = "2.0.148"

# we need to manually depend on mixin (+extras) in common
# PORT-26.3: the versions Fabric Loader 0.19.5 and NeoForge 26.3.0.77 ship with.
mixin = "0.17.4+mixin.0.8.7"
mixin-extras = "0.5.5"

jetbrains-annotations = "26.1.0"

# Mods
# PORT-26.3: still the 1.21.1 versions. Everything below Patchouli is disabled in the build files until the
# mod has a 26.3 build (see PORTING.md, "Disabled for now"); Patchouli's jar is used for its API only.
# PORT-26.3: the Patchouli 26.3 port (one version for all three artifacts)
patchouli = "26.3-94+port.2"

emi = "1.1.24+1.21.1"
# PORT-26.3: JEI for 26.3 is a beta
jei = "31.14.0.72"
rei = "26.3.824"
iris-fabric = "1.11.7+26.3-fabric"
iris-neoforge = "1.11.7+26.3-neoforge"

# PORT-26.3: Curios for 26.3 is a beta; Trinkets (dev.emi) ends at 1.21.1, so Fabric uses Trinkets Updated
# (Patbox fork, MIT), which bundles the Yumi library it needs at runtime.
curios = "17.0.0-beta.3+26.3"
trinkets-updated = "4.2.1+26.3"
yumi = "1.1.3+26.2"
teamreborn-energy = "4.1.0"

ears = "1.4.7"
sodium-fabric = "mc1.21.1-0.6.13-fabric"
sodium-neoforge = "mc1.21.1-0.6.13-neoforge"
embeddium = "1.0.15+mc1.21.1"

fiber = "0.23.0-2"
carpet = "1.21-1.4.147+v240613"
speedrunigt = "14.2+1.21.1"

# plugins
spotless = "7.0.2"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabric-loader" }

mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
mixin-extras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixin-extras" }

jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

# Patchouli
patchouli-xplat = { module = "vazkii.patchouli:patchouli-xplat", version.ref = "patchouli" }
patchouli-fabric = { module = "vazkii.patchouli:patchouli-fabric", version.ref = "patchouli" }
patchouli-neoforge = { module = "vazkii.patchouli:patchouli-neoforge", version.ref = "patchouli" }

# EMI
emi-xplat = { module = "dev.emi:emi-xplat-mojmap", version.ref = "emi" }
emi-fabric = { module = "dev.emi:emi-fabric", version.ref = "emi" }
emi-neoforge = { module = "dev.emi:emi-neoforge", version.ref = "emi" }

# JEI
# TODO: requiring a version number in the artifact ID is suboptimal
jei-common-api = { module = "mezz.jei:jei-26.3-common-api", version.ref = "jei" }
jei-fabric-full = { module = "mezz.jei:jei-26.3-fabric", version.ref = "jei" }
jei-fabric-api = { module = "mezz.jei:jei-26.3-fabric-api", version.ref = "jei" }
jei-neoforge-full = { module = "mezz.jei:jei-26.3-neoforge", version.ref = "jei" }
jei-neoforge-api = { module = "mezz.jei:jei-26.3-neoforge-api", version.ref = "jei" }

# REI
# (no Xplat/Common definition for REI, since it's Intermediary and thus useless to our Xplat module)
# PORT-26.3: 26.x ships unobfuscated, so REI publishes a loader-neutral API the Xplat code can compile against
rei-api = { module = "me.shedaniel:RoughlyEnoughItems-api", version.ref = "rei" }
iris-fabric = { module = "maven.modrinth:iris", version.ref = "iris-fabric" }
iris-neoforge = { module = "maven.modrinth:iris", version.ref = "iris-neoforge" }
rei-default-plugin = { module = "me.shedaniel:RoughlyEnoughItems-default-plugin", version.ref = "rei" }
rei-fabric = { module = "me.shedaniel:RoughlyEnoughItems-fabric", version.ref = "rei" }
rei-neoforge = { module = "me.shedaniel:RoughlyEnoughItems-neoforge", version.ref = "rei" }

# other mods
curios = { module = "top.theillusivec4.curios:curios-neoforge", version.ref = "curios" }
trinkets-updated = { module = "maven.modrinth:trinkets-updated", version.ref = "trinkets-updated" }
yumi = { module = "dev.yumi.mc.core:yumi-mc-foundation", version.ref = "yumi" }
ears = { module = "com.unascribed:ears-api", version.ref = "ears" }
teamreborn-energy = { module = "teamreborn:energy", version.ref = "teamreborn-energy" }
fiber = { module = "me.zeroeightsix:fiber", version.ref = "fiber" }
sodium-fabric = { module = "maven.modrinth:sodium", version.ref = "sodium-fabric" }
sodium-neoforge = { module = "maven.modrinth:sodium", version.ref = "sodium-neoforge" }
embeddium = { module = "maven.modrinth:embeddium", version.ref = "embeddium" }
carpet = { module = "carpet:fabric-carpet", version.ref = "carpet" }
speedrunigt = { module = "maven.modrinth:speedrunigt", version.ref = "speedrunigt" }

[bundles]
mixin = [ "mixin", "mixin-extras" ]

[plugins]
mdg = { id = "net.neoforged.moddev", version.ref = "mdg" }
# PORT-26.3: the plain plugin, not "-remap": 26.x is unobfuscated, so there is nothing to remap and no mappings.
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }

spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
