plugins {
    id("multiloader-loader")
    alias(libs.plugins.mdg)
}

repositories {
    maven {
        name = "C4"
        url = "https://maven.theillusivec4.top/"
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(":Xplat").file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    // PORT-26.3: no Parchment release for 26.x yet (see parchment_version in gradle.properties).
    //parchment {
    //    minecraftVersion = minecraft_version
    //    mappingsVersion = parchment_version
    //}

    runs {
        configureEach {
            systemProperty("neoforge.enabledGameTestNamespaces", mod_id)
            systemProperty("fml.earlyprogresswindow", "false")
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            gameDirectory = file("../run/")
        }

        client {
            client()
            systemProperty("neoforge.logging.console.level", "debug")
        }
        neoforgeDatagen {
            clientData() // PORT-26.3: client and server data in one run, like NeoForge itself
            programArguments.addAll("--mod", mod_id, "--all",
                    "--output", file("src/generated/resources/").getAbsolutePath(),
                    "--existing", file("src/main/resources/").getAbsolutePath())
        }
        gardenOfGlassDatagen {
            clientData()
            programArguments.addAll("--mod", mod_id, "--all",
                    "--output", file("../garden_of_glass/src/generated/resources/").getAbsolutePath(),
                    "--existing", file("../garden_of_glass/src/main/resources/").getAbsolutePath())
            systemProperty("botania.gog_datagen", "1")
        }
        server {
            server()
            systemProperty("neoforge.logging.console.level", "debug")
            programArgument("--nogui")
        }
        // PORT-26.3: `./gradlew :NeoForge:runGameTestServer` runs Botania's game tests (see BotaniaGameTests).
        // Vanilla reads .snbt test scenes only from a folder on disk, so the run copies Botania's there first.
        gameTestServer {
            type = "gameTestServer"
            programArguments.addAll("--tests", "botania:*")
            systemProperty("botania.gametest.structures", layout.buildDirectory.dir("gametest-structures").get().asFile.absolutePath)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly(libs.jetbrains.annotations)

    // PORT-26.3: Patchouli (API only, see Xplat/build.gradle) and Curios have no 26.3 release; Curios comes back
    // in Phase 5.
    compileOnly(libs.patchouli.xplat)
    //implementation(libs.patchouli.neoforge)
    //compileOnly(variantOf(libs.curios) { classifier("api") })

    // PORT-26.3: disabled until these mods have 26.3 builds (their code is in src/disabled/integration).
    //compileOnly(variantOf(libs.emi.neoforge) { classifier("api") })
    //compileOnly(libs.jei.neoforge.api)
    //compileOnly(libs.rei.neoforge)

    //compileOnly(libs.ears)
    //compileOnly(libs.sodium.neoforge) { transitive = false }
    //compileOnly(libs.embeddium) { transitive = false }

    //runtimeOnly(libs.curios)

    //if (rootProject.hasProperty("load_override_emi")) {
    //    runtimeOnly(libs.emi.neoforge)
    //} else if (rootProject.hasProperty("load_override_rei")) {
    //    runtimeOnly(libs.rei.neoforge)
    //} else {
    //    runtimeOnly(libs.jei.neoforge.full)
    //}

    if (file("../garden_of_glass/gardenofglass-${gog_version}.jar").exists()) {
        runtimeOnly(files("../garden_of_glass/gardenofglass-${gog_version}.jar"))
    }
}

// PORT-26.3: the test scenes in the layout vanilla's test structure folder expects (data/<namespace>/structure/...)
tasks.register("copyGameTestStructures", Sync) {
    from(project(":Xplat").file("src/main/resources/data/botania/gametest/structure"))
    into(layout.buildDirectory.dir("gametest-structures/data/botania/structure"))
}
tasks.matching { it.name == "runGameTestServer" }.configureEach { dependsOn("copyGameTestStructures") }
